name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 4Terminal version
      description: The output of `4t --version` (or Settings › About).
      placeholder: "4t 0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: dropdown
    id: agent
    attributes:
      label: Agent involved
      options: [None, Claude Code, Codex CLI, Other]
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, the shell you use, your settings file if relevant (remove anything private).
